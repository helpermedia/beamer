<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Beamer Delay</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="main.js"></script>
</head>
<body>
    <main class="editor" hidden>
        <header class="top">
            <div class="readout">
                <p class="readout-time"><span id="delay-time">0</span> <span class="readout-unit">ms</span></p>
                <p class="readout-source" id="delay-source"></p>
            </div>
            <div class="choices" id="stereo-mode" role="radiogroup" aria-label="Stereo mode"></div>
        </header>

        <figure class="echoes">
            <svg id="echoes" role="img" aria-label="The echoes over time"></svg>
        </figure>

        <section class="controls">
            <div class="choices" id="sync-mode" role="radiogroup" aria-label="Sync mode"></div>
            <div class="knobs">
                <div id="time"></div>
                <div id="feedback"></div>
                <div id="mix"></div>
            </div>
        </section>
    </main>
</body>
</html>
