<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Beamer Delay</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="main.js"></script>
</head>
<body>
    <main class="editor" hidden>
        <header class="title">
            <h1>Delay</h1>
            <!-- The Beamer logo for light grounds, a copy of docs/branding/beamer.svg. -->
            <img src="beamer-logo.svg" alt="Beamer">
        </header>

        <div class="top">
            <div class="delay">
                <p class="delay-time"><span id="delay-time">0</span> <span class="delay-unit">ms</span></p>
                <p class="delay-source" id="delay-source"></p>
            </div>
            <div class="radio-group" id="stereo-mode" role="radiogroup" aria-label="Stereo mode"></div>
        </div>

        <figure class="echoes">
            <svg id="echoes" role="img" aria-label="The echoes over time"></svg>
        </figure>

        <section class="controls">
            <div class="radio-group" id="sync-mode" role="radiogroup" aria-label="Sync mode"></div>
            <div class="dials">
                <div id="time"></div>
                <div id="feedback"></div>
                <div id="mix"></div>
            </div>
        </section>
    </main>
</body>
</html>
