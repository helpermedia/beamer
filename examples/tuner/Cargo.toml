[package]
name = "tuner"
description = "Example chromatic tuner demonstrating analysis on the audio thread in the Beamer framework"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[features]
au = ["beamer/au"]
vst3 = ["beamer/vst3"]

[lints]
workspace = true

[dependencies]
beamer = { workspace = true, features = ["allocation-check"] }
