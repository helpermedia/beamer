[package]
name = "xtask"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "xtask"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# Finds the web UI of a plugin by the rule of the export macro.
beamer-utils = { workspace = true }
uuid = { version = "1.11", features = ["v4"] }
toml = "1"
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# Tests check the AU type mapping against the one the plugin reports.
beamer-core = { workspace = true }
