[package]
name = "beamer"
description = "Audio plugin (AU, VST3) framework for Rust"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["derive"]
derive = ["beamer-macros"]

# Plugin format features - controlled by bundler via --features flag
au = ["dep:beamer-au"]
vst3 = ["dep:beamer-vst3", "dep:vst3"]

# Measure what the host does and write it to the system log, for test
# builds: `cargo xtask bundle <plugin> --diagnostics` sets it.
diagnostics = ["beamer-core/diagnostics", "beamer-au?/diagnostics", "beamer-vst3?/diagnostics"]

# Check in debug builds that process() neither allocates nor frees memory:
# `#[beamer::export]` installs a checking global allocator (see
# `beamer::allocation_check`). Not for a plugin with its own allocator.
allocation-check = ["beamer-core/allocation-check"]

[lints]
workspace = true

[dependencies]
beamer-core = { workspace = true }
beamer-webview = { workspace = true }
beamer-macros = { workspace = true, optional = true }
beamer-au = { workspace = true, optional = true }
beamer-vst3 = { workspace = true, optional = true }
vst3 = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }
# Tests create plugin instances through the format wrappers.
beamer-au = { workspace = true }
beamer-vst3 = { workspace = true }
