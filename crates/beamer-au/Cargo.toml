[package]
name = "beamer-au"
version.workspace = true
edition.workspace = true
description = "Audio Unit support for Beamer audio plugin framework (hybrid v2/v3 architecture)"
license.workspace = true
repository = "https://github.com/helpermedia/beamer"
keywords = ["audio", "plugin", "au", "audiounit", "music"]
categories = ["multimedia::audio"]

[features]
default = ["webview"]
## WebView GUI support.
webview = ["beamer-webview"]
sysex-heap-fallback = ["beamer-core/sysex-heap-fallback"]

[lints]
workspace = true

[dependencies]
beamer-core = { workspace = true }
beamer-webview = { workspace = true, optional = true }
log = { workspace = true }
serde_json = { workspace = true }

# Note: The hybrid ObjC/Rust AU architecture uses native Objective-C (wrappers that
# xtask generates per plugin) for AUAudioUnit subclassing, with a C-ABI bridge to
# Rust. This avoids the need for objc2/block2 crates which had issues with
# AUAudioUnit subclassing.
