[package]
name = "beamer-core"
description = "Core abstractions for the Beamer audio plugin (AU, VST3) framework"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Measure what the host does and write it to the system log (see the
# diagnostics module). For test builds only.
diagnostics = []
# Check in debug builds that process() neither allocates nor frees memory
# (see the allocation_check module). A plugin turns it on through the
# feature of the same name of `beamer`.
allocation-check = ["dep:backtrace"]

[lints]
workspace = true

[dependencies]
# Internal utilities crate (zero external deps)
beamer-utils = { workspace = true }
log = { workspace = true }
backtrace = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Installs the checking allocator, so it needs the feature.
[[test]]
name = "allocation_check"
required-features = ["allocation-check"]

[build-dependencies]
cc = "1"
