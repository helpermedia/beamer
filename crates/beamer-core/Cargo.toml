[package]
name = "beamer-core"
description = "Core abstractions for the Beamer audio plugin (AU, VST3) framework"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# SysEx buffer size options (default is 512 bytes)
sysex-256 = []
sysex-1024 = []
sysex-2048 = []
# Enable heap-backed fallback for SysEx output pool overflow
sysex-heap-fallback = []
# Measure what the host does and write it to the system log (see the
# diagnostics module). For test builds only.
diagnostics = []

[lints]
workspace = true

[dependencies]
# Internal utilities crate (zero external deps)
beamer-utils = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
cc = "1"
