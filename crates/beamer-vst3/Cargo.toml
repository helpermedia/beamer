[package]
name = "beamer-vst3"
description = "VST3 implementation layer for the Beamer audio plugin framework"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["webview"]
## WebView GUI support.
webview = ["beamer-webview"]
## Measure what the host does and write it to the system log. For test
## builds only (`cargo xtask bundle <plugin> --diagnostics`).
diagnostics = ["beamer-core/diagnostics"]

[lints]
workspace = true

[dependencies]
beamer-core = { workspace = true }
beamer-webview = { workspace = true, optional = true }
vst3 = { workspace = true }
log = { workspace = true }
com-scrape-types = "0.1"
serde_json = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
